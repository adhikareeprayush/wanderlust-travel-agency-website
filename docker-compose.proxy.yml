# Connects the app to a reverse proxy that already runs in Docker on this
# server and owns ports 80/443. Set PROXY_NETWORK to that proxy's network
# (e.g. in a .env file next to this one), then point the proxy at
# wanderlust-app:5000.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.proxy.yml up -d --build
services:
  app:
    networks:
      default:
      proxy:
        aliases:
          - wanderlust-app

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK to the Docker network of your existing reverse proxy}
